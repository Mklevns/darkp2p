services:
  caddy:
    # Pinned by tag and multi-arch index digest. To update, pick an exact
    # 2.x.y-alpine tag (https://hub.docker.com/_/caddy/tags), then take the
    # top-level "Digest:" line from:
    #   docker buildx imagetools inspect caddy:<tag>
    # and re-run: caddy validate --adapter caddyfile --config Caddyfile
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    container_name: darkp2p-caddy
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    security_opt:
      - "no-new-privileges:true"
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      darkp2p:
        condition: service_healthy
    networks:
      - internal

  darkp2p:
    build: .
    container_name: darkp2p
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    mem_limit: 384m
    pids_limit: 128
    tmpfs:
      - /tmp
    env_file:
      - .env
    environment:
      - PORT=3000
      - ONION_PORT=3001
    networks:
      - internal

  tor:
    build: ./tor
    container_name: darkp2p-tor
    restart: unless-stopped
    security_opt:
      - "no-new-privileges:true"
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    # The image runs tor as the unprivileged `tor` user. A tor_data volume
    # created by the old root-run container must be handed over once, keeping
    # the onion address:
    #   docker compose run --rm --no-deps --user root --entrypoint \
    #     chown tor -R tor:tor /var/lib/tor
    volumes:
      - ./tor/torrc:/etc/tor/torrc:ro
      - tor_data:/var/lib/tor
    depends_on:
      darkp2p:
        condition: service_healthy
    networks:
      - internal

  coturn:
    # Pinned by tag and multi-arch index digest. To update, pick an exact tag
    # (https://hub.docker.com/r/coturn/coturn/tags), then take the top-level
    # "Digest:" line (the manifest list, not a per-platform one) from:
    #   docker buildx imagetools inspect coturn/coturn:<tag>
    # and re-check flags with: docker run --rm coturn/coturn:<tag> --help
    image: coturn/coturn:4.6.3-r3-alpine@sha256:e2bca2f79a4269d7240de5872ab60a9305013ad37296d2acf14f9510874346be
    container_name: darkp2p-coturn
    restart: unless-stopped
    network_mode: host
    security_opt:
      - "no-new-privileges:true"
    # coturn logs the address of every client and peer, so its output is
    # discarded and never reaches the host disk. To debug temporarily, set
    # `driver: json-file` here and swap no-stdout-log/simple-log/
    # log-file=/dev/null in scripts/gen-turnserver-conf.sh for
    # log-file=stdout, then revert and
    # remove the container (docker compose rm -sf coturn) so the saved log is
    # deleted.
    logging:
      driver: "none"
    read_only: true
    tmpfs:
      - /var/tmp
      - /var/lib/coturn
    # All flags, including the TURN secret, live in this file, generated from
    # .env by: sudo scripts/gen-turnserver-conf.sh
    volumes:
      - ./coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
    command: ["-c", "/etc/coturn/turnserver.conf"]

networks:
  internal:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  tor_data:
