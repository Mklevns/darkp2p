services:
  caddy:
    image: caddy:2-alpine
    container_name: darkp2p-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - DOMAIN=${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      darkp2p:
        condition: service_healthy
    networks:
      - internal

  darkp2p:
    build: .
    container_name: darkp2p
    restart: unless-stopped
    read_only: true
    cap_drop:
      - ALL
    env_file:
      - .env
    environment:
      - PORT=3000
      - ONION_PORT=3001
    networks:
      - internal

  tor:
    image: alpine:3.20
    container_name: darkp2p-tor
    restart: unless-stopped
    command: >
      sh -c "apk add --no-cache tor &&
      mkdir -p /var/lib/tor/hidden_service &&
      chmod 700 /var/lib/tor/hidden_service &&
      printf 'HiddenServiceDir /var/lib/tor/hidden_service/\nHiddenServicePort 80 darkp2p:3001\n' > /etc/tor/torrc &&
      tor -f /etc/tor/torrc"
    volumes:
      - tor_data:/var/lib/tor
    depends_on:
      darkp2p:
        condition: service_healthy
    networks:
      - internal

  coturn:
    # Pinned by tag and multi-arch index digest. To update, pick an exact tag
    # (https://hub.docker.com/r/coturn/coturn/tags), then take the top-level
    # "Digest:" line (the manifest list, not a per-platform one) from:
    #   docker buildx imagetools inspect coturn/coturn:<tag>
    # and re-check flags with: docker run --rm coturn/coturn:<tag> --help
    image: coturn/coturn:4.6.3-r3-alpine@sha256:e2bca2f79a4269d7240de5872ab60a9305013ad37296d2acf14f9510874346be
    container_name: darkp2p-coturn
    restart: unless-stopped
    network_mode: host
    # coturn logs the address of every client and peer, so its output is
    # discarded and never reaches the host disk. To debug temporarily, set
    # `driver: json-file` here and swap --no-stdout-log/--log-file=/dev/null
    # below for --log-file=stdout, then revert and remove the container
    # (docker compose rm -sf coturn) so the saved log is deleted.
    logging:
      driver: "none"
    read_only: true
    tmpfs:
      - /var/tmp
      - /var/lib/coturn
    command:
      - --listening-port=3478
      - --realm=${TURN_HOST}
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET}
      - --fingerprint
      - --min-port=49160
      - --max-port=49200
      - --user-quota=4
      - --total-quota=40
      - --max-bps=5000000
      - --bps-capacity=50000000
      - --max-allocate-lifetime=1800
      - --stale-nonce=600
      - --no-cli
      - --no-tls
      - --no-dtls
      - --no-software-attribute
      - --no-multicast-peers
      - --no-tcp-relay
      - --denied-peer-ip=0.0.0.0-0.255.255.255
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=100.64.0.0-100.127.255.255
      - --denied-peer-ip=127.0.0.0-127.255.255.255
      - --denied-peer-ip=169.254.0.0-169.254.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.0.0.0-192.0.0.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255
      - --denied-peer-ip=198.18.0.0-198.19.255.255
      - --denied-peer-ip=240.0.0.0-255.255.255.255
      - --denied-peer-ip=${TURN_PUBLIC_IP:?Set TURN_PUBLIC_IP to the server's public IPv4}
      - "--denied-peer-ip=::-::"
      - --denied-peer-ip=::1
      - --denied-peer-ip=::ffff:0.0.0.0-::ffff:255.255.255.255
      - --denied-peer-ip=64:ff9b::-64:ff9b::ffff:ffff
      - --denied-peer-ip=2002::-2002:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      - --denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      - --denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      - --no-stdout-log
      - --log-file=/dev/null

networks:
  internal:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  tor_data:
