<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace">
  <!-- Social card source. Render to public/og-image.png with: node scripts/render-images.mjs -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#232b32" stroke-width="1" opacity="0.45"/>
    </pattern>
    <radialGradient id="glow" cx="0.78" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#00f0ff" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="#0a0c0e"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect x="40" y="40" width="1120" height="550" fill="#111519" fill-opacity="0.88" stroke="#232b32" stroke-width="2"/>
  <rect x="40" y="40" width="6" height="550" fill="#00f0ff"/>

  <text x="96" y="128" font-size="24" letter-spacing="3" fill="#6c7a89">// DEAD DROP</text>

  <!-- two browsers, one encrypted line between them -->
  <g fill="none" stroke="#00f0ff" stroke-width="3">
    <rect x="884" y="96" width="76" height="56"/>
    <rect x="1028" y="96" width="76" height="56"/>
    <path d="M960 124H1028" stroke-dasharray="8 8"/>
  </g>
  <path d="M884 110H960M1028 110H1104" stroke="#00f0ff" stroke-width="3"/>

  <text x="92" y="282" font-size="132" font-weight="800" letter-spacing="2" fill="#00f0ff">DarkP2P</text>
  <text x="96" y="356" font-size="38" fill="#d1d9e0">Encrypted browser-to-browser file transfer</text>

  <g font-size="25" fill="#05ffa1">
    <rect x="96" y="424" width="286" height="58" fill="#05ffa1" fill-opacity="0.06" stroke="#05ffa1" stroke-width="2"/>
    <text x="239" y="462" text-anchor="middle">E2E AES-256-GCM</text>
    <rect x="406" y="424" width="302" height="58" fill="#05ffa1" fill-opacity="0.06" stroke="#05ffa1" stroke-width="2"/>
    <text x="557" y="462" text-anchor="middle">No server storage</text>
    <rect x="732" y="424" width="346" height="58" fill="#05ffa1" fill-opacity="0.06" stroke="#05ffa1" stroke-width="2"/>
    <text x="905" y="462" text-anchor="middle">Works in Tor Browser</text>
  </g>

  <text x="96" y="546" font-size="26" letter-spacing="1" fill="#6c7a89">darkp2p.com</text>
</svg>
