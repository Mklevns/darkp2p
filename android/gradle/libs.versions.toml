# Exact versions only: no ranges, no "+". Every artifact resolved from these is
# pinned by checksum in gradle/verification-metadata.xml.
[versions]
agp = "9.5.3"
kotlin = "2.4.21"
coroutines = "1.11.0"
serialization = "1.13.0"
kover = "0.9.11"
junit = "5.10.1"
junit-platform = "1.10.1"
# Desktop libwebrtc, for host-JVM tests of the WebRTC path only. Never shipped.
webrtc-java = "1.0.1"

minSdk = "29"
compileSdk = "37"
compileSdkMinor = "2"
targetSdk = "37"

# Planned (docs/android/TECHNICAL_DESIGN.md §2.2); wired in by the phase that first uses them.
okhttp = "5.5.1"
webrtc = "150.7871.09"
zxing = "3.5.4"
tor-android = "0.4.9.17"
compose-bom = "2026.11.01"
work = "2.12.0"
camerax = "1.7.0"
browser = "1.10.0"
biometric = "1.1.0"
# biometric 1.1.0 only asks for fragment 1.2.5, whose FragmentActivity rejects the
# request codes that activity 1.13's ActivityResultRegistry uses (crash on any launcher).
fragment = "1.9.1"
activity = "1.13.0"
core-ktx = "1.19.1"
lifecycle = "2.11.1"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }

kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlin" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher", version.ref = "junit-platform" }

webrtc-java = { module = "dev.onvoid.webrtc:webrtc-java", version.ref = "webrtc-java" }

okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
webrtc = { module = "io.github.webrtc-sdk:android", version.ref = "webrtc" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
tor-android = { module = "info.guardianproject:tor-android", version.ref = "tor-android" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
camerax-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
camerax-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
camerax-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }
work-runtime = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
camerax-core = { module = "androidx.camera:camera-core", version.ref = "camerax" }
browser = { module = "androidx.browser:browser", version.ref = "browser" }
biometric = { module = "androidx.biometric:biometric", version.ref = "biometric" }
fragment = { module = "androidx.fragment:fragment", version.ref = "fragment" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
