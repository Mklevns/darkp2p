name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # node --check server.js, then scripts/check-inline-js.mjs: a syntax
      # check of every executable inline <script> in public/index.html.
      - name: Check server.js and inline scripts
        run: npm run check

      # Everything in test/. The compose tests use the runner's docker compose.
      - name: Run tests
        run: npm test

      - name: Validate docker-compose.yml
        run: npm run check:compose

      - name: Build Docker image
        run: docker build -t darkp2p:ci .

      - name: Smoke test /health endpoint
        run: |
          docker run -d --name darkp2p-test -p 3000:3000 darkp2p:ci
          trap "docker rm -f darkp2p-test" EXIT
          sleep 2
          curl -fsS http://127.0.0.1:3000/health | grep -q "^ok$"

  # The Android client (android/). Its :protocol tests read test/vectors/v3.json,
  # which the Node job above checks against public/index.html.
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # :transport's tests run the real server.js and the real page script.
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install server dependencies
        working-directory: .
        run: npm ci

      # Structural checks (module graph, :protocol purity, forbidden APIs,
      # pinned versions), unit and interop tests and lint, then one APK per flavor.
      # Dependencies are verified against gradle/verification-metadata.xml.
      - name: Check and build
        run: ./gradlew --no-daemon check :app:assembleFullDebug :app:assembleLibreRelease

  # The tests that need Android itself (android/*/src/androidTest): the Keystore
  # vault, and where the file drop's server listens. On an emulator, at the oldest
  # release the app supports and at a recent one.
  android-device:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api-level: [29, 34]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # Without KVM the emulator is too slow to boot within the job's time.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: On-device tests (API ${{ matrix.api-level }})
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: default
          disable-animations: true
          working-directory: android
          script: ./gradlew --no-daemon :storage:connectedDebugAndroidTest :transport:connectedFullDebugAndroidTest

      - name: Keep the test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-device-reports-api-${{ matrix.api-level }}
          path: android/*/build/reports/androidTests/
          retention-days: 7
