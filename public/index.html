<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#09090b">
    <title>Darkp2p</title>
    <meta name="description" content="Darkp2p peer-to-peer infrastructure.">
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
        background: #09090b;
        color: #f4f4f5;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        background:
          radial-gradient(circle at 50% 20%, rgba(99, 102, 241, 0.16), transparent 28rem),
          #09090b;
      }
      nav {
        width: min(1120px, calc(100% - 40px));
        height: 72px;
        margin: 0 auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 1px solid rgba(255,255,255,.08);
      }
      .brand { font-weight: 800; letter-spacing: -0.03em; }
      .status {
        color: #a1a1aa;
        font-size: 0.875rem;
      }
      main {
        width: min(1120px, calc(100% - 40px));
        min-height: calc(100vh - 72px);
        margin: 0 auto;
        display: grid;
        place-content: center;
        text-align: center;
      }
      h1 {
        max-width: 800px;
        margin: 0;
        font-size: clamp(3.5rem, 10vw, 7.5rem);
        line-height: 0.92;
        letter-spacing: -0.075em;
        background: linear-gradient(135deg, #fff 20%, #71717a 90%);
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      p {
        max-width: 520px;
        margin: 28px auto 0;
        color: #a1a1aa;
        font-size: clamp(1rem, 2vw, 1.2rem);
        line-height: 1.7;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 24px;
        padding: 8px 12px;
        border: 1px solid rgba(255,255,255,.1);
        border-radius: 999px;
        color: #d4d4d8;
        font-size: 0.75rem;
        letter-spacing: .08em;
        text-transform: uppercase;
      }
      .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #22c55e;
        box-shadow: 0 0 16px #22c55e;
      }
    </style>
  </head>
  <body>
    <nav>
      <div class="brand">DARKP2P</div>
      <div class="status">darkp2p.com</div>
    </nav>
    <main>
      <div>
        <div class="pill"><span class="dot"></span> Network online</div>
        <h1>Direct by<br>design.</h1>
        <p>Peer-to-peer infrastructure for a faster, more distributed internet.</p>
      </div>
    </main>
  </body>
</html>
